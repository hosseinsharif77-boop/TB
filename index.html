        ArrowRight: <path d="M5 12h14M12 5l7 7-7 7" />, ArrowLeft: <path d="M19 12H5M12 19l-7-7 7-7" />, Search: <><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></>, MessageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />, ShieldCheck: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />, Check: <path d="M20 6 9 17l-5-5" />, X: <path d="M18 6 6 18M6 6l12 12" />, Building2: <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18M6 12H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-2M6 18h12" />, Briefcase: <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16M8 10H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-2" />, LayoutDashboard: <><rect width="7" height="9" x="3" y="3" rx="1" /><rect width="7" height="5" x="14" y="3" rx="1" /><rect width="7" height="9" x="14" y="12" rx="1" /><rect width="7" height="5" x="3" y="16" rx="1" /></>, Send: <path d="m22 2-7 20-4-9-9-4ZM22 2 11 13" />, Plus: <path d="M5 12h14M12 5v14" />, Sparkles: <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" />, Radar: <><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34" /><path d="M4 6h.01" /><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35" /><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67" /><path d="M12 18h.01" /><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67" /><circle cx="12" cy="12" r="2" /><path d="m13.41 10.59 5.66-5.66" /></>, ClipboardCheck: <><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4" /></>, Globe: <><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5  0 0 0 0-20M2 12h20" /></>, LogOut: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />, Menu: <path d="M3 12h18M3 6h18M3 18h18" />
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="inline-block">
          {paths[name]}
        </svg>
      );
    };

    const Btn = ({ children, onClick, variant = "primary", className = "", t2 }) => {
      const base = t2 ? "inline-flex items-center gap-2 transition-all duration-200 font-mono uppercase tracking-[0.1em]" : "px-5 py-2.5 text-sm font-semibold rounded-lg inline-flex items-center gap-2 transition-all duration-200";
      const styles = t2 ? {
        primary: "btn-primary px-5 py-3 text-[11px] font-semibold rounded-sm",
        secondary: "btn-secondary px-5 py-3 text-[11px] font-semibold rounded-sm",
        ghost: "text-muted hover:text-ink hover:bg-white rounded-sm transition-colors px-3 py-2 text-[11px] font-medium",
        danger: "btn-danger px-4 py-2.5 text-[11px] font-medium rounded-sm"
      } : { primary: "btn-primary", secondary: "btn-secondary", ghost: "text-muted hover:text-ink hover:bg-slate-100 rounded-lg transition-colors", danger: "btn-danger" };
      return <button type="button" onClick={onClick} className={`${base} ${styles[variant]} ${className}`}>{children}</button>;
    };

    const Chip = ({ label, active, onClick, t2 }) => (
      <button type="button" onClick={onClick} className={`border transition-all duration-200 ${t2 ? 'px-3.5 py-2 text-[11px] font-mono uppercase tracking-wider rounded-sm' : 'px-4 py-2 text-sm font-medium rounded-lg'} ${active ? (t2 ? 'bg-ink text-bg border-ink' : 'bg-accent text-white border-accent') : 'bg-white text-muted border-line hover:border-faint hover:text-ink'}`}>{label}</button>
    );

    const Tag = ({ children, tone = "muted", t2 }) => (
      <span className={`inline-flex items-center border ${t2 ? 'text-[10px] font-mono uppercase tracking-wider px-2 py-1 rounded-sm' : 'text-xs px-2.5 py-1 rounded-md'} ${tone === 'accent' ? (t2 ? 'text-accent border-accent/30 bg-accentLight' : 'bg-accentLight text-accent border-accentLight') : (t2 ? 'text-muted border-line bg-transparent' : 'bg-slate-50 text-muted border-line')}`}>{children}</span>
    );

    const StarRating = ({ value = 0 }) => (
      <span className="inline-flex items-center gap-1.5" dir="ltr">
        <span className="inline-flex items-center gap-0.5">
          {[1, 2, 3, 4, 5].map((i) => (
            <svg key={i} width="14" height="14" viewBox="0 0 24 24" fill={i <= value ? "currentColor" : "none"} stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" className={i <= value ? "text-signal" : "text-faint"}>
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z" />
            </svg>
          ))}
        </span>
        <span className="text-xs font-medium text-muted">{Number(value).toFixed(1)}</span>
      </span>
    );

    const HeaderControls = ({ setLang, isAr }) => (
      <div className="flex gap-2 items-center">
        {/* Language Switch */}
        <div className="flex items-center gap-0.5 p-1 rounded-md border border-line bg-transparent">
          <button onClick={() => setLang('en')} className={`px-2.5 py-1 text-[10px] font-mono uppercase rounded-sm transition ${isAr ? 'text-muted hover:text-ink' : 'bg-ink text-bg'}`}>EN</button>
          <button onClick={() => setLang('ar')} className={`px-2.5 py-1 text-[10px] font-mono uppercase rounded-sm transition ${!isAr ? 'text-muted hover:text-ink' : 'bg-ink text-bg'}`}>عربي</button>
        </div>
      </div>
    );

    const Onboarding = ({ t, t2, isAr, lang, role, form, setForm, toggleChip, onboardStep, setOnboardStep, completeOnboarding, signOut, setLang }) => {
      const isUK = role === "uk";
      const steps = [t('onboard_basics'), isUK ? t('onboard_cap') : t('onboard_needs'), t('onboard_market'), t('onboard_obj')];
      return (
        <div className="min-h-screen flex flex-col justify-center max-w-xl mx-auto px-4 sm:px-6 py-16 sm:py-20 bg-bg relative">
          <div className="absolute top-0 left-0 right-0 flex items-center justify-between px-4 sm:px-6 pt-5">
            <button onClick={signOut} className="p-2 text-muted hover:text-danger transition">
              <Icon name="X" size={24} />
            </button>
            <HeaderControls setLang={setLang} isAr={isAr} />
          </div>
          <div className="text-xs font-semibold uppercase tracking-wider text-accent mb-2">{t('onboard_step')} {onboardStep} {t('onboard_of')} {steps.length}</div>
          <h2 className="text-2xl sm:text-4xl font-extrabold text-ink mb-6 sm:mb-8">{steps[onboardStep - 1]}</h2>
          {onboardStep === 1 && (
            <div className="space-y-6">
              <div><label className="text-xs font-semibold uppercase tracking-wider text-muted block mb-2">{t('onboard_entity_name')}</label><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full bg-white border border-line rounded-lg px-4 py-3 text-base focus:border-accent focus:ring-1 focus:ring-accent outline-none transition text-ink" /></div>
              <div><label className="text-xs font-semibold uppercase tracking-wider text-muted block mb-2">{isUK ? t('onboard_country') : t('onboard_gcc_country')}</label>{isUK ? <input value="United Kingdom" disabled className="w-full bg-slate-50 border border-line rounded-lg px-4 py-3 text-base text-muted outline-none" /> : <div className="flex flex-wrap gap-2">{GCC_COUNTRIES[lang].map((x, idx) => { const enVal = isAr ? GCC_COUNTRIES.en[idx] : x; return <Chip t2={t2} key={enVal} label={x} active={form.country === enVal} onClick={() => setForm({ ...form, country: enVal })} />; })}</div>}</div>
              <div><label className="text-xs font-semibold uppercase tracking-wider text-muted block mb-2">{t('onboard_comp_size')}</label><div className="flex flex-wrap gap-2">{COMPANY_SIZES[lang].map((x, i) => <Chip t2={t2} key={x} label={x} active={form.size === COMPANY_SIZES.en[i]} onClick={() => setForm({ ...form, size: COMPANY_SIZES.en[i] })} />)}</div></div>
            </div>
          )}
          {onboardStep === 2 && <div className={`bg-white border border-line p-6 shadow-saas ${t2 ? 'rounded-lg' : 'rounded-2xl'}`}><div className="flex flex-wrap gap-2">{CAPABILITIES[lang].map((x, i) => <Chip t2={t2} key={x} label={x} active={(form.capabilities || []).includes(CAPABILITIES.en[i])} onClick={() => toggleChip("capabilities", CAPABILITIES.en[i])} />)}</div><div className="mt-4 text-xs font-medium text-muted">{isAr ? `تم اختيار ${(form.capabilities || []).length}` : `${(form.capabilities || []).length} selected`}</div></div>}
          {onboardStep === 3 && <div className="space-y-6"><div className={`bg-white border border-line p-6 shadow-saas ${t2 ? 'rounded-lg' : 'rounded-2xl'}`}><label className="text-xs font-semibold uppercase tracking-wider text-muted block mb-3">{t('onboard_industries')}</label><div className="flex flex-wrap gap-2">{INDUSTRIES[lang].map((x, i) => <Chip t2={t2} key={x} label={x} active={(form.industries || []).includes(INDUSTRIES.en[i])} onClick={() => toggleChip("industries", INDUSTRIES.en[i])} />)}</div><div className="mt-3 text-xs font-medium text-muted">{isAr ? `تم اختيار ${(form.industries || []).length}` : `${(form.industries || []).length} selected`}</div></div>{isUK && <div className={`bg-white border border-line p-6 shadow-saas ${t2 ? 'rounded-lg' : 'rounded-2xl'}`}><label className="text-xs font-semibold uppercase tracking-wider text-muted block mb-3">{t('onboard_target')}</label><div className="flex flex-wrap gap-2">{GCC_COUNTRIES[lang].map((x, i) => { const enVal = isAr ? GCC_COUNTRIES.en[i] : x; return <Chip t2={t2} key={enVal} label={x} active={(form.targetMarkets || []).includes(enVal)} onClick={() => toggleChip("targetMarkets", enVal)} />; })}</div><div className="mt-3 text-xs font-medium text-muted">{isAr ? `تم اختيار ${(form.targetMarkets || []).length}` : `${(form.targetMarkets || []).length} selected`}</div></div>}</div>}
          {onboardStep === 4 && <div className={`bg-white border border-line p-6 shadow-saas ${t2 ? 'rounded-lg' : 'rounded-2xl'}`}><div className="flex flex-wrap gap-2">{PARTNERSHIP_TYPES[lang].map((x, i) => <Chip t2={t2} key={x} label={x} active={(form.partnershipTypes || []).includes(PARTNERSHIP_TYPES.en[i])} onClick={() => toggleChip("partnershipTypes", PARTNERSHIP_TYPES.en[i])} />)}</div><div className="mt-4 text-xs font-medium text-muted">{isAr ? `تم اختيار ${(form.partnershipTypes || []).length}` : `${(form.partnershipTypes || []).length} selected`}</div></div>}
          <InfoBox title={t('info_onboard')} t2={t2}>
            <p>{t('info_onboard_d')}</p>
          </InfoBox>
          <div className="flex gap-3 mt-10">
            {onboardStep > 1 && <Btn t2={t2} variant="secondary" onClick={() => setOnboardStep(s => s - 1)}>{t('onboard_back')}</Btn>}
            {onboardStep < 4 ? <Btn t2={t2} variant="primary" onClick={() => setOnboardStep(s => s + 1)}>{t('onboard_continue')}</Btn> : <Btn t2={t2} variant="primary" onClick={completeOnboarding}>{t('onboard_finish')}</Btn>}
          </div>
        </div>
      );
    };

    const SectionLabel = ({ children, t2 }) => (
      t2 ? (
        <div className="inline-flex items-center gap-2 text-[11px] font-mono uppercase tracking-[0.16em] text-accent mb-4">
          <span className="w-4 h-px bg-signal"></span>{children}
        </div>
      ) : (
        <div className="inline-block text-xs font-semibold uppercase tracking-wider text-accent bg-accentLight px-3 py-1 rounded-full mb-4">{children}</div>
      )
    );

    const InfoBox = ({ title, children, defaultOpen = false, t2 }) => {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div className={`mt-6 border ${t2 ? 'border-accent/20 bg-accentLight/40' : 'border-accentLight bg-slate-50'} rounded-lg overflow-hidden transition-all duration-300`}>
          <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between px-5 py-3.5 text-left hover:bg-accentLight/30 transition-colors">
            <div className="flex items-center gap-2.5">
              <div className={`w-7 h-7 flex items-center justify-center rounded-md ${t2 ? 'bg-accent/10 text-accent' : 'bg-accentLight text-accent'}`}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
              </div>
              <span className="text-sm font-semibold text-ink">{title}</span>
            </div>
            <svg className={`w-4 h-4 text-muted transition-transform duration-200 ${open ? 'rotate-180' : ''}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          {open && (
            <div className="px-5 pb-5 pt-0">
              <div className="text-sm leading-relaxed text-muted border-t border-line pt-4">
                {children}
              </div>
            </div>
          )}
        </div>
      );
    };

    const ManifestLine = ({ from, to, refId, note }) => (
      <div className="flex items-center gap-2.5 text-[10px] font-mono uppercase tracking-[0.12em] text-muted border-t border-b border-line py-2">
        <span className="text-ink font-medium">{from}</span>
        <span className="text-signal dir-arrow">&#8594;</span>
        <span className="text-ink font-medium">{to}</span>
        <span className="text-faint">|</span>
        <span>{refId}</span>
        {note && <><span className="text-faint">|</span><span className="text-accent">{note}</span></>}
      </div>
    );

    const PageHeader = ({ title, subtitle, t2 }) => (
      <div className="mb-8">
        <SectionLabel t2={t2}>{subtitle}</SectionLabel>
        <h2 className={`text-2xl sm:text-3xl font-bold text-ink tracking-tight ${!t2 ? 'font-extrabold' : ''}`}>{title}</h2>
      </div>
    );

    const useReveal = () => {
      const ref = useRef(null);
      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); } }, { threshold: 0.1 });
        if (ref.current) observer.observe(ref.current);
        return () => { if (ref.current) observer.unobserve(ref.current); };
      }, []);
      return ref;
    };

    function App() {
      const [theme, setTheme] = useState("theme2");
      const [lang, setLang] = useState("en");
      const t2 = theme === "theme2";
      const t = (key) => STRINGS[lang][key] || key;
      const isAr = lang === 'ar';

      const [mode, setMode] = useState("public");
      const [publicView, setPublicView] = useState("home");
      const [platformView, setPlatformView] = useState("dashboard");
      const [role, setRole] = useState(null);
      const [onboardStep, setOnboardStep] = useState(0);
      const [profile, setProfile] = useState(null);
      const [matches, setMatches] = useState([]);
      const [detailCompany, setDetailCompany] = useState(null);
      const [detailOpportunity, setDetailOpportunity] = useState(null);
      const [detailMatch, setDetailMatch] = useState(null);
      const [opportunities, setOpportunities] = useState(INITIAL_OPPORTUNITIES);
      const [threads, setThreads] = useState({});
      const [activeThread, setActiveThread] = useState(null);
      const [requests, setRequests] = useState([]);
      const [pendingCompanies, setPendingCompanies] = useState([{ id: "p1", name: "Meridian Data Ltd", country: "UK", flag:"GB", submitted: "2d" }, { id: "p2", name: "Riyadh Cloud Works", country:"SA", flag:"SA", submitted: "1d" }]);
      const [pendingOpportunities, setPendingOpportunities] = useState([{ id: "po1", title: "IoT Partner for Smart Warehousing", country:"AE", flag:"AE", submitted: "6h" }]);
      const [form, setForm] = useState({ name: "", country: "United Kingdom", size: "11–50", description: "", capabilities: [], industries: [], targetMarkets: [], partnershipTypes: [] });

      useEffect(() => {
        document.body.className = `${theme} lang-${lang}`;
        document.body.dir = isAr ? 'rtl' : 'ltr';
      }, [theme, lang]);

      const toggleChip = (field, value) => setForm((f) => { const arr = f[field] || []; return { ...f, [field]: arr.includes(value) ? arr.filter((v) => v !== value) : [...arr, value] }; });
      const startOnboarding = (r) => { setRole(r); setForm({ name: "", country: r === "uk" ? "United Kingdom" : "Saudi Arabia", size: "11–50", description: "", capabilities: [], industries: [], targetMarkets: [], partnershipTypes: [] }); setOnboardStep(1); setMode("platform"); setPlatformView("onboarding"); };
      const completeOnboarding = () => { const np = { id: "you", ...form, verification: isAr ? "تحقق البريد" : "Email Verified" }; setProfile(np); let m = []; if (role === "uk") { m = opportunities.map((o) => ({ kind: "opportunity", target: o, ...scoreAgainstOpportunity(np, o) })); } else { m = UK_COMPANIES.map((c) => ({ kind: "company", target: c, ...scoreAgainstCompany(np, c) })); } m.sort((a, b) => b.score - a.score); setMatches(m); setPlatformView("dashboard"); };
      const postOpportunity = (opp) => setOpportunities((prev) => [{ ...opp, id: "opp" + (prev.length + 1), postedBy: "you" }, ...prev]);
      const openThread = (name) => { setThreads((prev) => (prev[name] ? prev : { ...prev, [name]: [ { from: "them", text: isAr ? "مرحباً، شكراً على التقديم. يسعدني ترتيب مكالمة قصيرة." : "Hi — thanks for the introduction. Happy to arrange a short call." } ] })); setActiveThread(name); setPlatformView("messages"); };
      const sendMessage = (name, text) => { if (!text.trim()) return; setThreads((prev) => ({ ...prev, [name]: [...(prev[name] || []), { from: "you", text }] })); };
      const sendRequest = (name, kind) => setRequests((prev) => prev.some((r) => r.withName === name) ? prev : [{ id: "req" + prev.length, withName: name, kind, status: isAr ? "قيد الانتظار" : "Pending" }, ...prev]);
      const goCompanyDetail = (c, from) => { setDetailCompany(c); from === "public" ? setPublicView("companyDetail") : setPlatformView("companyDetail"); };
      const goOpportunityDetail = (o, from) => { setDetailOpportunity(o); from === "public" ? setPublicView("opportunityDetail") : setPlatformView("opportunityDetail"); };
      const signOut = () => { setMode("public"); setPublicView("home"); setRole(null); setProfile(null); };

      const PublicNav = () => {
        const [scrolled, setScrolled] = useState(false);
        const [mobileNav, setMobileNav] = useState(false);
        useEffect(() => {
          const handleScroll = () => setScrolled(window.scrollY > 10);
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);
        
        const navItems = [ { id: "how", label: t('nav_mechanism') }, { id: "browseCompanies", label: t('nav_directory') }, { id: "browseOpportunities", label: t('nav_opportunities') }, { id: "academic", label: t('nav_research') }, { id: "about", label: t('nav_about') } ];

        return (
          <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${t2 ? 'bg-bg/95 backdrop-blur-lg border-b border-line py-4' : 'bg-white/95 backdrop-blur-lg border-b border-line py-4'} ${scrolled ? 'shadow-sm' : ''}`}>
            <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
              <button onClick={() => { setPublicView("home"); setMobileNav(false); }} className={`${t2 ? 'text-lg font-display font-semibold' : 'text-xl font-extrabold'} tracking-tight text-ink flex items-center gap-2.5`}>
                <div className={`w-8 h-8 flex items-center justify-center text-xs font-mono ${t2 ? 'border border-ink rounded-sm text-ink' : 'bg-accent rounded-lg text-white'}`}>TB</div>
                TechBridge
              </button>
              <div className="hidden md:flex gap-5 text-xs font-mono uppercase tracking-wider">
                {navItems.map(item => (
                  <button key={item.id} onClick={() => setPublicView(item.id)} className={`transition-colors ${t2 ? `font-semibold pb-1.5 border-b-2 ${publicView === item.id ? 'border-signal text-ink' : 'border-transparent text-ink/60 hover:text-ink hover:border-faint'}` : `px-3 py-1.5 rounded-md text-sm font-medium ${publicView === item.id ? 'bg-slate-100 text-ink' : 'text-muted hover:text-ink'}`}`}>{item.label}</button>
                ))}
              </div>
              <div className="flex gap-3 items-center">
                <HeaderControls setLang={setLang} isAr={isAr} />
                <div className="hidden md:flex gap-3 items-center">
                  <button className="text-[11px] font-mono uppercase tracking-wider text-muted hover:text-ink transition-colors hidden lg:block" onClick={() => setMode("admin")}>{t('nav_governance')}</button>
                  <Btn t2={t2} variant="primary" onClick={() => startOnboarding("uk")}>{t('nav_enter')}</Btn>
                </div>
                <button onClick={() => setMobileNav(v => !v)} className="md:hidden p-2 text-ink" aria-label="Menu">
                  <Icon name={mobileNav ? "X" : "Menu"} size={20} />
                </button>
              </div>
            </div>
            {mobileNav && (
              <div className="md:hidden border-t border-line shadow-xl relative z-[60] bg-white">
                <div className="flex flex-col px-6 py-3 gap-1">
                  {navItems.map(item => (
                    <button key={item.id} onClick={() => { setPublicView(item.id); setMobileNav(false); }} className={`text-left py-2.5 text-sm font-medium ${publicView === item.id ? (t2 ? 'text-signal' : 'text-accent') : 'text-muted'}`}>{item.label}</button>
                  ))}
                  <button onClick={() => { setMode("admin"); setMobileNav(false); }} className="text-left py-2.5 text-sm font-medium text-muted">{t('nav_governance')}</button>
                  <Btn t2={t2} variant="primary" onClick={() => { startOnboarding("uk"); setMobileNav(false); }} className="mt-2 w-full justify-center">{t('nav_enter')}</Btn>
                </div>
              </div>
            )}
          </nav>
        );
      };

      const PLATFORM_NAV = [
        { id: "dashboard", label: t('plat_overview'), icon: "LayoutDashboard" },
        { id: "browseCompanies", label: role === "uk" ? t('plat_entities_gcc') : t('plat_entities_uk'), icon: "Building2" },

                <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas lg:sticky lg:top-24`}>
                  <div className="text-xs font-semibold uppercase tracking-wider text-accent mb-4">{t('about_steps_t')}</div>
                  <ol>
                    {aboutSteps.map((s, i) => (
                      <li key={s} className="flex items-center gap-4 py-3 border-b border-line last:border-b-0">
                        <span className={`w-7 h-7 flex items-center justify-center text-[10px] font-mono ${t2 ? 'border border-ink text-ink rounded-sm' : 'bg-accent text-white rounded-full'}`}>{i + 1}</span>
                        <span className="text-sm font-semibold text-ink">{s}</span>
                      </li>
                    ))}
                  </ol>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const BrowseCompanies = ({ within = "public" }) => {
        const [side, setSide] = useState(role === "gcc" ? "uk" : role === "uk" ? "gcc" : "gcc");
        const list = side === "uk" ? UK_COMPANIES : GCC_COMPANIES;
        return (
          <div className={`${within === "public" ? "pt-24 sm:pt-28 max-w-7xl mx-auto px-4 sm:px-6 pb-12 sm:pb-16" : ""}`}>
            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
              <PageHeader t2={t2} title={side === "uk" ? t('dir_title_uk') : t('dir_title_gcc')} subtitle={t('dir_sub')} />
              <div className={`flex gap-1 p-1 ${t2 ? 'bg-white border border-line rounded-sm' : 'bg-slate-100 rounded-lg'}`}>
                <button onClick={() => setSide("gcc")} className={`${t2 ? 'px-4 py-2 text-[11px] font-mono uppercase tracking-wider rounded-sm' : 'px-4 py-2 text-sm font-medium rounded-md'} transition ${side === "gcc" ? (t2 ? 'bg-ink text-bg' : 'bg-white text-ink shadow-sm') : 'text-muted'}`}>GCC</button>
                <button onClick={() => setSide("uk")} className={`${t2 ? 'px-4 py-2 text-[11px] font-mono uppercase tracking-wider rounded-sm' : 'px-4 py-2 text-sm font-medium rounded-md'} transition ${side === "uk" ? (t2 ? 'bg-ink text-bg' : 'bg-white text-ink shadow-sm') : 'text-muted'}`}>UK</button>
              </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {list.map((c, i) => (
                <div key={c.id} className={`bg-white border border-line p-6 shadow-saas saas-card cursor-pointer ${t2 ? 'rounded-lg' : 'rounded-2xl'}`} onClick={() => goCompanyDetail(c, within)}>
                  {t2 ? (
                    <>
                      <ManifestLine from={c.flag} to={side === "uk" ? "GCC" : "UK"} refId={`TB-${c.id.toUpperCase()}`} />
                      <div className="flex justify-between items-start gap-3 mt-4 mb-3">
                        <h3 className="text-xl font-semibold text-ink">{c.name[lang]}</h3>
                        <Tag t2={t2} tone="accent">{c.verification[lang]}</Tag>
                      </div>
                    </>
                  ) : (
                    <div className="flex justify-between items-start mb-4">
                      <div className="w-12 h-12 bg-bg rounded-xl flex items-center justify-center font-mono text-sm">{c.flag}</div>
                      <Tag t2={t2}>{c.verification[lang]}</Tag>
                    </div>
                  )}
                  {!t2 && <h3 className="text-xl font-bold text-ink mb-2">{c.name[lang]}</h3>}
                  <p className="text-sm text-muted mb-4 h-10 overflow-hidden">{c.blurb[lang]}</p>
                  <div className="flex flex-wrap gap-1.5 mb-4">{c.capabilities.slice(0,2).map(x => <Tag t2={t2} key={x}>{translateArr(x, CAPABILITIES)}</Tag>)}</div>
                  <button className="text-sm font-medium text-accent flex items-center gap-1">{isAr ? "عرض الملف" : "View profile"} <Icon name={isAr ? "ArrowLeft" : "ArrowRight"} size={14} /></button>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const BrowseOpportunities = ({ within = "public" }) => (
        <div className={`${within === "public" ? "pt-24 sm:pt-28 max-w-7xl mx-auto px-4 sm:px-6 pb-12 sm:pb-16" : ""}`}>
          <PageHeader t2={t2} title={t('opp_board_title')} subtitle={t('opp_board_sub')} />
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {opportunities.map((o, i) => (
              <div key={o.id} className={`bg-white border border-line p-6 shadow-saas saas-card cursor-pointer ${t2 ? 'rounded-lg' : 'rounded-2xl'}`} onClick={() => goOpportunityDetail(o, within)}>
                {t2 && <ManifestLine from={o.flag} to="UK" refId={`TB-${o.id.toUpperCase()}`} />}
                <div className={`flex justify-between items-start ${t2 ? 'mt-4 mb-3' : 'mb-4'}`}>
                  <Tag t2={t2} tone="accent">{translateArr(o.partnershipType, PARTNERSHIP_TYPES)}</Tag>
                  <span className={`${t2 ? 'text-[11px] font-mono uppercase tracking-wider text-muted' : 'text-xs text-muted'}`}>{o.deadline}</span>
                </div>
                <h3 className={`text-xl ${t2 ? 'font-semibold' : 'font-bold'} text-ink mb-2`}>{o.title[lang]}</h3>
                <p className="text-sm text-muted mb-4 h-10 overflow-hidden">{o.description[lang]}</p>
                <div className="flex flex-wrap gap-1.5 mb-4">{o.lookingFor.slice(0,3).map(x => <Tag t2={t2} key={x}>{translateArr(x, CAPABILITIES)}</Tag>)}</div>
                <div className="flex justify-between items-center pt-4 border-t border-line">
                  <span className="text-sm text-muted">{o.flag} {translateArr(o.country, GCC_COUNTRIES)}</span>
                  <button className="text-sm font-medium text-accent flex items-center gap-1">{isAr ? "عرض" : "View"} <Icon name={isAr ? "ArrowLeft" : "ArrowRight"} size={14} /></button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      const DetailView = ({ within, type }) => {
        const item = type === "company" ? detailCompany : detailOpportunity;
        if (!item) return null;
        return (
          <div className={`${within === "public" ? "pt-24 sm:pt-28 max-w-7xl mx-auto px-4 sm:px-6 pb-12 sm:pb-16" : ""}`}>
            <button onClick={() => within === "public" ? setPublicView(type === "company" ? "browseCompanies" : "browseOpportunities") : setPlatformView(type === "company" ? "browseCompanies" : "browseOpportunities")} className="flex items-center gap-2 text-sm font-medium text-muted hover:text-ink mb-6 transition">
              <Icon name={isAr ? "ArrowRight" : "ArrowLeft"} size={14}/> {t('back')}
            </button>
            <div className="grid grid-cols-1 sm:grid-cols-12 gap-6 sm:gap-8">
              <div className="col-span-1 sm:col-span-8">
                <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-8 shadow-saas`}>
                  {t2 ? (
                    <ManifestLine from={item.flag || "GB"} to={type === "company" ? (item.flag === "GB" ? "GCC" : "UK") : "UK"} refId={`TB-${item.id.toUpperCase()}`} note={type === "company" ? item.verification[lang] : translateArr(item.partnershipType, PARTNERSHIP_TYPES)} />
                  ) : (
                    <div className="text-xs font-semibold uppercase tracking-wider text-accent mb-3">{item.flag} {translateArr(item.country, GCC_COUNTRIES) || "United Kingdom"}</div>
                  )}
                  <h1 className={`text-2xl sm:text-4xl font-bold text-ink mt-5 mb-4 ${!t2 ? 'font-extrabold' : ''}`}>{item.name ? item.name[lang] : item.title[lang]}</h1>
                  <p className="text-lg text-muted leading-relaxed mb-8">{item.blurb ? item.blurb[lang] : item.description[lang]}</p>
                  {type === "company" ? (
                    <div className="space-y-6 border-t border-line pt-6">
                      <div><div className="text-xs font-semibold uppercase tracking-wider text-muted mb-3">{t('detail_core_cap')}</div><div className="flex flex-wrap gap-2">{item.capabilities.map(x => <Tag t2={t2} key={x}>{translateArr(x, CAPABILITIES)}</Tag>)}</div></div>
                      <div><div className="text-xs font-semibold uppercase tracking-wider text-muted mb-3">{t('detail_industries')}</div><p className="text-sm text-ink">{item.industries.map(x => translateArr(x, INDUSTRIES)).join(" • ")}</p></div>
                    </div>
                  ) : (
                    <div className="space-y-6 border-t border-line pt-6">
                      <div><div className="text-xs font-semibold uppercase tracking-wider text-muted mb-3">{t('detail_looking_for')}</div><div className="flex flex-wrap gap-2">{item.lookingFor.map(x => <Tag t2={t2} key={x} tone="accent">{translateArr(x, CAPABILITIES)}</Tag>)}</div></div>
                      <div><div className="text-xs font-semibold uppercase tracking-wider text-muted mb-3">{t('detail_part_type')}</div><p className="text-sm text-ink">{translateArr(item.partnershipType, PARTNERSHIP_TYPES)}</p></div>
                    </div>
                  )}
                </div>
              </div>
              <div className="col-span-1 sm:col-span-4">
                <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas sticky top-32`}>
                  <div className="text-xs font-semibold uppercase tracking-wider text-muted mb-4">{t('detail_meta')}</div>
                  <div className="space-y-3 text-sm">
                    {type === "company" ? (
                      <>
                        <div className="flex justify-between border-b border-line pb-3"><span className="text-muted">{t('detail_size')}</span><span className="text-ink font-medium">{item.size}</span></div>
                        <div className="flex justify-between border-b border-line pb-3"><span className="text-muted">{t('detail_verification')}</span><span className="text-accent font-medium">{item.verification[lang]}</span></div>
                        {item.history && <div className="flex justify-between gap-3 border-b border-line pb-3"><span className="text-muted shrink-0">{t('detail_history')}</span><span className="text-ink font-medium text-right leading-snug">{item.history[lang]}</span></div>}
                        {item.address && (
                          <div className="border-b border-line pb-3">
                            <div className="flex justify-between gap-3"><span className="text-muted shrink-0">{t('detail_address')}</span><span className="text-ink font-medium text-right leading-snug">{item.address[lang]}</span></div>
                            {item.mapQuery && (
                              <div className="mt-3 space-y-2">
                                <iframe src={`https://www.google.com/maps?q=${encodeURIComponent(item.mapQuery)}&output=embed`} className="w-full h-36 rounded-md border border-line" loading="lazy" title={t('detail_address')}></iframe>
                                <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery)}`} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 text-xs font-medium text-accent hover:text-accentHover transition-colors">{t('detail_open_map')} <Icon name={isAr ? "ArrowLeft" : "ArrowRight"} size={12} /></a>
                              </div>
                            )}
                          </div>
                        )}
                        {item.rating != null && <div className="flex justify-between items-center border-b border-line pb-3"><span className="text-muted">{t('detail_rating')}</span><StarRating value={item.rating} /></div>}
                      </>
                    ) : (
                      <>
                        <div className="flex justify-between border-b border-line pb-3"><span className="text-muted">{t('detail_budget')}</span><span className="text-ink font-medium">{item.budget[lang]}</span></div>
                        <div className="flex justify-between border-b border-line pb-3"><span className="text-muted">{t('detail_deadline')}</span><span className="text-ink font-medium">{item.deadline}</span></div>
                      </>
                    )}
                  </div>
                  <div className="mt-6 flex flex-col gap-3">
                    {type === "company" ? (
                      <>
                        <Btn t2={t2} variant="primary" onClick={() => { sendRequest(item.name[lang], "introduction"); if (mode === "public") startOnboarding(role || "uk"); }}>{t('detail_request_intro')}</Btn>
                        <Btn t2={t2} variant="secondary" onClick={() => openThread(item.name[lang])}>{t('detail_message')}</Btn>
                      </>
                    ) : (
                      <Btn t2={t2} variant="primary" onClick={() => { sendRequest(item.title[lang], "interest"); if (mode === "public") startOnboarding("uk"); }}>{t('detail_express_interest')}</Btn>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const PublicFooter = () => (
        <footer className="border-t border-line bg-white py-10">
          <div className="max-w-7xl mx-auto px-6">
            <InfoBox title={t('info_glossary')} t2={t2}>
              <pre className="text-xs leading-relaxed whitespace-pre-wrap font-sans">{t('info_glossary_d')}</pre>
            </InfoBox>
            <div className="flex flex-wrap justify-between gap-4 items-center mt-6">
              <div>
                <div className="text-xl font-extrabold text-ink">TechBridge</div>
                <p className="text-xs text-muted mt-1">{t('footer_note')}</p>
              </div>
              <button onClick={() => setMode("admin")} className="text-sm font-medium text-muted hover:text-ink transition">{isAr ? '← ' : ''}{t('nav_governance')}{!isAr ? ' →' : ''}</button>
            </div>
          </div>
        </footer>
      );

      const Dashboard = () => (
        <div>
          <PageHeader t2={t2} title={`${t('dash_welcome')}, ${profile?.name || (isAr ? "الكيان" : "Entity")}`} subtitle={t('dash_overview')} />
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas`}><div className="text-[11px] font-mono uppercase tracking-wider text-muted mb-2">{t('dash_profile')}</div><div className={`text-4xl ${t2 ? 'font-mono font-semibold' : 'font-extrabold'} text-ink`}>{Math.min(100, 40 + form.capabilities.length * 6 + form.industries.length * 4)}%</div></div>
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas`}><div className="text-[11px] font-mono uppercase tracking-wider text-muted mb-2">{t('dash_matches')}</div><div className={`text-4xl ${t2 ? 'font-mono font-semibold' : 'font-extrabold'} ${t2 ? 'text-signal' : 'text-accent'}`}>{matches.length}</div></div>
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas`}><div className="text-[11px] font-mono uppercase tracking-wider text-muted mb-2">{t('dash_requests')}</div><div className={`text-4xl ${t2 ? 'font-mono font-semibold' : 'font-extrabold'} text-ink`}>{requests.length}</div></div>
          </div>
          <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} shadow-saas overflow-hidden`}>
            <div className="p-6 border-b border-line"><h3 className="text-xl font-bold text-ink">{t('dash_top_matches')}</h3></div>
            <div>{matches.slice(0, 3).map((m, i) => <MatchRow key={i} m={m} onView={(mm) => { setDetailMatch(mm); setPlatformView("matchDetail"); }} />)}</div>
          </div>
          <InfoBox title={t('info_dashboard')} t2={t2}>
            <p>{t('info_dashboard_d')}</p>
          </InfoBox>
        </div>
      );

      const MatchRow = ({ m, onView }) => {
        const name = m.kind === "opportunity" ? m.target.title[lang] : m.target.name[lang];
        return (
          <div className="flex items-center justify-between py-4 px-6 border-b border-line last:border-0 hover:bg-slate-50 transition-colors cursor-pointer" onClick={() => onView(m)}>
            <div><div className="text-xs text-muted mb-1">{m.target.flag} {translateArr(m.target.country, GCC_COUNTRIES)}</div><div className="text-base font-medium text-ink">{name}</div></div>
            <div className="flex items-center gap-4"><span className={`${t2 ? 'bg-signalLight text-signal rounded-sm font-mono' : 'bg-accentLight text-accent rounded-md'} px-2 py-1 text-xs font-semibold`}>{m.score}%</span><Icon name={isAr ? "ArrowLeft" : "ArrowRight"} size={16} className="text-muted" /></div>
          </div>
        );
      };

      const MatchDetail = () => {
        const m = detailMatch;
        if (!m) return null;
        const name = m.kind === "opportunity" ? m.target.title[lang] : m.target.name[lang];
        return (
          <div className="max-w-4xl">
            <button onClick={() => setPlatformView("matches")} className="flex items-center gap-2 text-sm font-medium text-muted hover:text-ink mb-6 transition"><Icon name={isAr ? "ArrowRight" : "ArrowLeft"} size={14}/> {t('back')}</button>
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-8 shadow-saas mb-6`}>
              <div className="text-xs font-semibold uppercase tracking-wider text-muted mb-3">{m.target.flag} {translateArr(m.target.country, GCC_COUNTRIES)}</div>
              <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end mb-8 border-b border-line pb-6 gap-4">
                <h1 className="text-2xl sm:text-3xl font-bold text-ink">{name}</h1>
                <div className="text-left sm:text-right"><div className={`text-4xl sm:text-5xl font-mono font-semibold ${t2 ? 'text-signal' : 'text-accent'}`}>{m.score}%</div><div className="text-[11px] font-mono uppercase tracking-wider text-muted mt-1">{t('match_potential')}</div></div>
              </div>
              <div className="space-y-5">
                {Object.entries(m.breakdown).map(([k, v]) => (
                  <div key={k}>
                    <div className="flex justify-between text-sm mb-2"><span className="text-muted">{MATCH_WEIGHTS.find(w => w.label.en === k)?.label[lang] || k}</span><span className="text-ink font-mono font-medium">{v}</span></div>
                    <div className={`h-${t2 ? '1.5' : '2'} bg-line w-full rounded-full overflow-hidden`}><div className={`h-full rounded-full match-bar-fill ${t2 ? 'bg-signal' : 'bg-accent'}`} style={{width: `${v}%`}}></div></div>
                  </div>
                ))}
              </div>
            </div>
            <div className={`bg-accentLight border ${t2 ? 'border-accent/20' : 'border-accentLight'} ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-5 mb-6 flex items-center gap-3`}>
              <Icon name="ShieldCheck" size={24} className="text-accent" />
              <p className="text-sm text-accent font-medium">{t('match_alert')}</p>
            </div>
            <div className="flex gap-3">
              <Btn t2={t2} variant="primary" onClick={() => sendRequest(name, "partnership")}>{requests.some(r => r.withName === name) ? t('match_req_sent') : t('match_send_req')}</Btn>
              <Btn t2={t2} variant="secondary" onClick={() => openThread(name)}>{t('detail_message')}</Btn>
            </div>
            <InfoBox title={t('info_detail')} t2={t2}>
              <p>{t('info_detail_d')}</p>
            </InfoBox>
          </div>
        );
      };

      const MessagesView = () => {
        const [draft, setDraft] = useState("");
        const names = Object.keys(threads);
        return (
          <div>
            <PageHeader t2={t2} title={t('msg_title')} subtitle={t('msg_sub')} />
            <InfoBox title={t('info_msgs')} t2={t2}>
              <p>{t('info_msgs_d')}</p>
            </InfoBox>
            {names.length === 0 ? <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-8 text-center text-muted`}>{t('msg_none')}</div> : (
              <div className={`grid grid-cols-1 md:grid-cols-3 gap-0 bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} shadow-saas overflow-hidden md:h-[60vh]`}>
                <div className="col-span-1 md:col-span-1 ${isAr ? 'md:border-l' : 'md:border-r'} border-line overflow-y-auto bg-bg md:max-h-[60vh]">
                  {names.map(n => <button key={n} onClick={() => setActiveThread(n)} className={`w-full text-left px-4 py-3 border-b border-line text-sm transition ${activeThread === n ? "bg-white text-accent font-medium border-l-2 border-l-accent" : "text-muted hover:bg-slate-50"}`}>{n}</button>)}
                </div>
                <div className="col-span-2 md:col-span-2 flex flex-col">
                  <div className="flex-1 p-4 sm:p-6 space-y-4 overflow-y-auto bg-white min-h-[30vh] sm:min-h-0">
                    {(threads[activeThread] || []).map((msg, i) => <div key={i} className={`max-w-[85%] sm:max-w-md p-3 rounded-xl text-sm ${msg.from === "you" ? "ml-auto bg-accent text-white" : "bg-bg text-ink border border-line"}`}>{msg.text}</div>)}
                  </div>
                  <div className="p-3 border-t border-line flex gap-2 bg-white">
                    <input value={draft} onChange={(e) => setDraft(e.target.value)} placeholder={t('msg_input')} className="flex-1 bg-bg border border-line rounded-lg px-4 py-2 text-sm outline-none focus:border-accent text-ink" />
                    <Btn t2={t2} variant="primary" onClick={() => { sendMessage(activeThread, draft); setDraft(""); }}><Icon name="Send" size={16} /></Btn>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const RequestsView = () => (
        <div>
          <PageHeader t2={t2} title={t('req_title')} subtitle={t('req_sub')} />
          {requests.length === 0 ? <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-8 text-center text-muted`}>{t('req_none')}</div> : (
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} shadow-saas overflow-hidden`}>
              {requests.map(r => (
                <div key={r.id} className="flex items-center justify-between py-4 px-6 border-b border-line last:border-0">
                  <div><div className="text-base font-medium text-ink">{r.withName}</div><div className="text-xs text-muted mt-1">{r.kind}</div></div>
                  <span className={`text-xs font-medium px-3 py-1 rounded-md ${r.status === "Accepted" || r.status === "مقبول" ? "bg-accentLight text-accent" : "bg-slate-100 text-muted"}`}>{r.status}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );

      const PostOpportunity = () => {
        const [f, setF] = useState({ title: "", lookingFor: [], industry: "", partnershipType: "" });
        return (
          <div className="max-w-2xl">
            <PageHeader t2={t2} title={t('post_title')} subtitle={t('post_sub')} />
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas space-y-6`}>
              <div><label className="text-xs font-semibold uppercase tracking-wider text-muted block mb-2">{t('post_title_label')}</label><input value={f.title} onChange={(e) => setF({ ...f, title: e.target.value })} className="w-full bg-bg border border-line rounded-lg px-4 py-3 text-base focus:border-accent focus:ring-1 focus:ring-accent outline-none transition text-ink" /></div>
              <div><label className="text-xs font-semibold uppercase tracking-wider text-muted block mb-3">{t('post_looking_for')}</label><div className="flex flex-wrap gap-2">{CAPABILITIES[lang].map((x, i) => <Chip t2={t2} key={x} label={x} active={f.lookingFor.includes(CAPABILITIES.en[i])} onClick={() => setF(prev => ({ ...prev, lookingFor: prev.lookingFor.includes(CAPABILITIES.en[i]) ? prev.lookingFor.filter(v => v !== CAPABILITIES.en[i]) : [...prev.lookingFor, CAPABILITIES.en[i]] }))} />)}</div></div>
            </div>
            <Btn t2={t2} variant="primary" className="mt-6" onClick={() => { postOpportunity({ title: {en: f.title || "Untitled", ar: f.title || "بدون عنوان"}, lookingFor: f.lookingFor, industry: "Tech", partnershipType: "Strategic", budget: {en: "N/A", ar: "غير متاح"}, deadline: "Open", country: "Saudi Arabia", flag: "SA", description: {en: "Dashboard post.", ar: "منشور لوحة التحكم."} }); setPlatformView("browseOpportunities"); }}>{t('post_publish')}</Btn>
          </div>
        );
      };

      const GovernanceView = () => (
        <div className="min-h-screen p-4 sm:p-8 max-w-7xl mx-auto bg-bg">
          <div className="flex justify-between items-center mb-6">
            <button onClick={() => { setMode("public"); setPublicView("home"); }} className="flex items-center gap-2 text-sm font-medium text-muted hover:text-ink transition"><Icon name={isAr ? "ArrowRight" : "ArrowLeft"} size={14}/> {t('exit_gov')}</button>
            <HeaderControls setLang={setLang} isAr={isAr} />
          </div>
          <PageHeader t2={t2} title={t('gov_title')} subtitle={t('gov_sub')} />
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas`}><div className="text-[11px] font-mono uppercase tracking-wider text-muted mb-2">{t('gov_pending_comp')}</div><div className={`text-4xl ${t2 ? 'font-mono font-semibold' : 'font-extrabold'} text-ink`}>{pendingCompanies.length}</div></div>
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas`}><div className="text-[11px] font-mono uppercase tracking-wider text-muted mb-2">{t('gov_pending_opp')}</div><div className={`text-4xl ${t2 ? 'font-mono font-semibold' : 'font-extrabold'} text-ink`}>{pendingOpportunities.length}</div></div>
            <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} p-6 shadow-saas`}><div className="text-[11px] font-mono uppercase tracking-wider text-muted mb-2">{t('gov_live')}</div><div className={`text-4xl ${t2 ? 'font-mono font-semibold' : 'font-extrabold'} text-ink`}>{UK_COMPANIES.length + GCC_COMPANIES.length}</div></div>
          </div>
          <div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} shadow-saas overflow-hidden`}>
            <div className="p-6 border-b border-line"><h3 className="text-xl font-bold text-ink">{t('gov_queue')}</h3></div>
            <div>
              {pendingCompanies.map(c => (
                <div key={c.id} className="flex items-center justify-between py-4 px-6 border-b border-line last:border-0">
                  <div><div className="text-xs text-muted mb-1">{c.flag} {c.country}</div><div className="text-base font-medium text-ink">{c.name}</div></div>
                  <div className="flex gap-2">
                    <button onClick={() => setPendingCompanies(p => p.filter(x => x.id !== c.id))} className={`p-2 border border-line ${t2 ? 'rounded-sm' : 'rounded-lg'} hover:bg-accent hover:text-white hover:border-accent transition text-muted`}><Icon name="Check" size={16} /></button>
                    <button onClick={() => setPendingCompanies(p => p.filter(x => x.id !== c.id))} className={`p-2 border border-line ${t2 ? 'rounded-sm' : 'rounded-lg'} hover:bg-slate-500 hover:text-white hover:border-slate-500 transition text-muted`}><Icon name="X" size={16} /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      if (mode === "admin") return <GovernanceView />;
      if (mode === "public") {
        return (
          <div className="min-h-screen">
            <PublicNav />
            {publicView === "home" && <Home />}
            {publicView === "how" && <HowItWorks />}
            {publicView === "academic" && <AcademicContext />}
            {publicView === "about" && <AboutUs />}
            {publicView === "browseCompanies" && <BrowseCompanies within="public" />}
            {publicView === "browseOpportunities" && <BrowseOpportunities within="public" />}
            {publicView === "companyDetail" && <DetailView within="public" type="company" />}
            {publicView === "opportunityDetail" && <DetailView within="public" type="opportunity" />}
            <PublicFooter />
          </div>
        );
      }

      return (
        <div className="min-h-screen">
          {platformView === "onboarding" ? <Onboarding t={t} t2={t2} isAr={isAr} lang={lang} role={role} form={form} setForm={setForm} toggleChip={toggleChip} onboardStep={onboardStep} setOnboardStep={setOnboardStep} completeOnboarding={completeOnboarding} signOut={signOut} setLang={setLang} /> : (
            <PlatformShell>
              {platformView === "dashboard" && <Dashboard />}
              {platformView === "browseCompanies" && <BrowseCompanies within="platform" />}
              {platformView === "browseOpportunities" && <BrowseOpportunities within="platform" />}
              {platformView === "companyDetail" && <DetailView within="platform" type="company" />}
              {platformView === "opportunityDetail" && <DetailView within="platform" type="opportunity" />}
              {platformView === "matches" && <div><PageHeader t2={t2} title={isAr ? "جميع التطابقات المحتملة" : "All Potential Matches"} subtitle={t('plat_matching')} /><div className={`bg-white border border-line ${t2 ? 'rounded-lg' : 'rounded-2xl'} shadow-saas overflow-hidden`}>{matches.map((m, i) => <MatchRow key={i} m={m} onView={(mm) => { setDetailMatch(mm); setPlatformView("matchDetail"); }} />)}</div></div>}
              {platformView === "matchDetail" && <MatchDetail />}
              {platformView === "messages" && <MessagesView />}
              {platformView === "requests" && <RequestsView />}
              {platformView === "postOpportunity" && <PostOpportunity />}
            </PlatformShell>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
